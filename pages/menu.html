<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
    <title>Menu | Diverso</title>
</head>
<body>
    <header>
        <img src="../assets/logo_transparent.png" alt="Logo Diverso" class="logo">
    </header>
        <main>
            <section class="introduction">
                <h1>Notre Menu</h1>
                <p>Découvrez notre menu varié, conçu pour satisfaire tous les goûts et toutes les envies. Que vous soyez amateur de plats traditionnels ou à la recherche de nouvelles saveurs, nous avons quelque chose pour vous.</p>
            </section>
            <section class="menu-navigation">
                <nav>
                    <button>Salé</button>
                    <button>Sucré</button>
                    <button>Boissons</button>
                    <button>Petit déjeuner</button>
                    <button>Autres</button>
                </nav>
            </section>
            <section class="category-display">
                <h2>Choisissez votre catégorie</h2>
                <div id="categories-container"></div>
            </section>
        </main>


<script src="../js/menu.js"></script>
</body>
</html>
